  <metadata>{"concept_id": "edu.regular-dot-lattice", "profiles": ["swell-paper-v1", "index-embossed-v1", "viewplus-variable-height-v1"], "teaching": "Begin with aligned real pegs or counters,then transfer to separate tactile points in rows and columns. Compare across rows and down columns;no connecting lines or enclosure. Nine points/three rows is this introductory example,not a universal size or Braille cell. Nominal25mm intervals are independently chosen and not the source one-inch full-page worksheet. Swell/ViewPlus3mm point footprints contrast with native1.2mm Index dots at the same nine logical centres;actual point recognition requires physical evaluation.", "geometry_exception": "Index native graphic dots retain logical centreline/point locations;5.5mm joint guards only in quadrilateral sampling. Point lattice footprint is3mm Swell/VP and1.2mm Index. Not exact sourceworksheet.", "physical_evaluation": "pending"}</metadata>
