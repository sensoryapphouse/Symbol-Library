<svg xmlns="http://www.w3.org/2000/svg" data-master-schema="tactile-shared-v1" data-concept-id="edu.segment-midpoint-example" width="150mm" height="50mm" viewBox="0 0 150 50"><metadata>{"concept_id": "edu.segment-midpoint-example", "source_master_path": "tactile/masters/education/mathematics/measurement/segment-midpoint-example-423-draft-v01.svg", "source_master_sha256": "fa5303e6370a1e72f8467d2a06262312db00b6e8c0afc9b995cef73d20a5b7b4", "page_fit_revision": {"status": "regenerated", "method": "Preserved physical segment with enlarged semantic point glyphs and new Index sampling; no whole export scaling.", "simplification": "The original 130 mm segment and its exact midpoint retain both 65 mm halves. All three semantic point disks enlarge from 4.4 to 6.4 mm diameter. Unused margins are removed; line widths and ViewPlus grey height role remain unchanged. Index sampling is re-placed at 5 mm pitch with a 3.7 mm clear gap to each semantic point disk.", "canvas_mm": [150, 50]}, "teaching": "The original 130 mm segment and its exact midpoint retain both 65 mm halves. All three semantic point disks enlarge from 4.4 to 6.4 mm diameter. Unused margins are removed; line widths and ViewPlus grey height role remain unchanged. Index sampling is re-placed at 5 mm pitch with a 3.7 mm clear gap to each semantic point disk. Three semantic points identify the two endpoints and exact midpoint; they are distinct from ordinary Index line-sampling dots. Physical testing remains pending.", "nominal_checks": {"line_width_mm": 1.4, "semantic_point_diameter_mm": 6.4, "half_segment_lengths_mm": [65, 65], "index_dot_diameter_mm": 1.2, "index_dot_pitch_mm": 5, "index_sampling_to_semantic_point_clearance_mm": 3.7, "midpoint_exact": true}, "region_roles": {"left-endpoint": "left-endpoint", "exact-midpoint": "exact-midpoint", "right-endpoint": "right-endpoint"}}</metadata><g id="swell-paper-v1" data-output-profile="swell-paper-v1" data-export-root="{&quot;data-concept-id&quot;: &quot;edu.segment-m