  <metadata>{"concept_id": "edu.single-bar-unit-stack", "profiles": ["swell-paper-v1", "index-embossed-v1", "viewplus-variable-height-v1"], "teaching": "Introduce a teacher-taught convention that each congruent cell stands for one unit. Trace the single16mm-wide bar divided into four16mm-high cells by three horizontal dividers. No original golf-ball values, categories, axes, labels or statistical data are claimed. The native243 preview has three bars despite its title; this independent example is not exact source coverage. A completed quantitative reading task and physical tracing remain untested.", "geometry_exception": "Swell and ViewPlus share1.4mm segment geometry. Native1.2mm Index dots follow the same logical unit boundaries at4mm pitch; congruent triangles use5.6mm acute-corner guards and identical rotated sampling. Shared boundary dots are deduplicated. This is not exact source worksheet reproduction.", "physical_evaluation": "pending"}</metadata>
