  <metadata>{"concept_id": "edu.regular-hexagon-example", "profiles": ["swell-paper-v1", "index-embossed-v1", "viewplus-variable-height-v1"], "teaching": "Explore a real six-sided regular shape model, then trace this planar outline. Six equal 32mm sides and six 120-degree interior angles define the chosen regular example; arbitrary hexagons need not be regular. No side numerals, angle marks or labels are drawn. Fourmm near-corner Index guards retain a single vertex point. Physical tracing and recognition remain pending.", "geometry_exception": "Native Index dots follow polygon boundaries with4mm near-corner guards, or sample the continuous paper-clip route atapproximately3.5mm arc-length pitch. Swell/ViewPlus share1.4mm centrelines. This is not exact source worksheet reproduction.", "physical_evaluation": "pending"}</metadata>
