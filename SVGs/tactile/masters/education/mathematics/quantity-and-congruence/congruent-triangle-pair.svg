  <metadata>{"concept_id": "edu.congruent-triangle-pair", "profiles": ["swell-paper-v1", "index-embossed-v1", "viewplus-variable-height-v1"], "teaching": "Compare two physical triangle cutouts before tracing these separated outlines. The second triangle is the first rotated180degrees about the tile centre, with no scale or reflection. Both have side lengths24mm,36mm andsqrt1872mm, and area432square-mm. All three side lengths are unequal; both are right triangles. The unchanged shape/size demonstrates a chosen congruence example, not a general proof or a source worksheet reconstruction. No written labels or angle marks are drawn; physical matching and recognition remain pending.", "geometry_exception": "Swell and ViewPlus share1.4mm segment geometry. Native1.2mm Index dots follow the same logical unit boundaries at4mm pitch; congruent triangles use5.6mm acute-corner guards and identical rotated sampling. Shared boundary dots are deduplicated. This is not exact source worksheet reproduction.", "physical_evaluation": "pending"}</metadata>
