  <metadata>{"concept_id": "edu.irregular-convex-quadrilateral-example", "profiles": ["swell-paper-v1", "index-embossed-v1", "viewplus-variable-height-v1"], "teaching": "Trace one closed four-sided convex boundary and compare a physical model. Its four straight sides are unequal and no opposite pair is parallel in the chosen example. This is one irregular convex quadrilateral, not a rectangle, rhombus or exhaustive quadrilateral taxonomy. The faint source construction lines and annotations are omitted because their objective is unresolved; no exact worksheet completion is claimed. Physical tracing and recognition remain pending.", "geometry_exception": "Swell and ViewPlus share1.4mm boundaries,1mm references/diagonals and explicit dashed circle references. Native1.2mm Index dots follow the logical graph with single junction dots and recorded corner guards; circle reference dots are sparser than perimeter dots. All alternatives remain in the same master. No exact source reconstruction.", "physical_evaluation": "pending"}</metadata>
